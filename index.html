<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <style>
    body { margin: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; direction: ltr; }
    .calculator { width: 100%; max-width: 400px; background: #000; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; box-sizing: border-box; }
    #display { color: #fff; font-size: 80px; text-align: right; margin-bottom: 20px; font-weight: 300; padding: 0 10px; word-wrap: break-word; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    button { background: #333; color: #fff; border: none; font-size: 32px; height: 75px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    button.gray { background: #a6a6a6; color: #000; }
    button.orange { background: #ff9f0a; color: #fff; }
    button.zero { grid-column: span 2; border-radius: 40px; width: 100%; justify-content: flex-start; padding-left: 30px; }
    
    /* الخزنة السرية */
    #vault { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: #fff; padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 100; text-align: center; }
    #vault h1 { color: #ff9f0a; font-size: 22px; margin-bottom: 5px; }
    .upload-box { background: #222; border: 2px dashed #444; padding: 15px; border-radius: 12px; margin: 15px 0; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .gallery img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; cursor: pointer; }

    /* نافذة عرض الصورة المكبرة */
    #viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    #viewer img { max-width: 100%; max-height: 70vh; border-radius: 10px; object-fit: contain; }
    .viewer-btns { display: flex; gap: 10px; margin-top: 20px; width: 100%; max-width: 300px; justify-content: center; }
    .viewer-btns button { font-size: 16px; height: 45px; border-radius: 8px; flex: 1; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- واجهة الحاسبة -->
  <div class="calculator" id="calcScreen">
    <div id="display">0</div>
    <div class="buttons">
      <button class="gray" onclick="clearDisp()">AC</button>
      <button class="gray" onclick="appendVal('+/-')">+/-</button>
      <button class="gray" onclick="appendVal('%')">%</button>
      <button class="orange" onclick="appendVal('/')">÷</button>
      <button onclick="appendVal('7')">7</button>
      <button onclick="appendVal('8')">8</button>
      <button onclick="appendVal('9')">9</button>
      <button class="orange" onclick="appendVal('*')">×</button>
      <button onclick="appendVal('4')">4</button>
      <button onclick="appendVal('5')">5</button>
      <button onclick="appendVal('6')">6</button>
      <button class="orange" onclick="appendVal('-')">-</button>
      <button onclick="appendVal('1')">1</button>
      <button onclick="appendVal('2')">2</button>
      <button onclick="appendVal('3')">3</button>
      <button class="orange" onclick="appendVal('+')">+</button>
      <button class="zero" onclick="appendVal('0')">0</button>
      <button onclick="appendVal('.')">.</button>
      <button class="orange" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- الخزنة السرية -->
  <div id="vault">
    <h1>🔥 أرشيف عمك المشايخ 😎</h1>
    <p style="color: #888; font-size: 14px;">خزنة الصور والملفات السرية الخاصة</p>
    <div class="upload-box">
      <input type="file" id="fileInput" multiple accept="image/*" onchange="loadFiles(event)">
    </div>
    <button onclick="lockVault()" style="background: #ff3b30; color: #fff; width: 100%; border: none; border-radius: 10px; height: 45px; font-size: 16px; font-weight: bold; cursor: pointer;">إقفال الخزنة والخروج</button>
    <div class="gallery" id="gallery"></div>
  </div>

  <!-- نافذة تكبير الصورة والتنقل بينها -->
  <div id="viewer">
    <img id="fullImg" src="" alt="Zoomed">
    <div class="viewer-btns">
      <button style="background: #333; color:#fff;" onclick="prevImg()">السابق</button>
      <button style="background: #ff3b30; color:#fff;" onclick="deleteCurrentImg()">حذف</button>
      <button style="background: #333; color:#fff;" onclick="nextImg()">التالي</button>
    </div>
    <button onclick="closeViewer()" style="background: #555; color: #fff; width: 100%; max-width: 300px; margin-top: 10px; height: 40px; border-radius: 8px; border:none; cursor:pointer;">إغلاق المعرض</button>
  </div>

  <script>
    let currentInput = "0";
    let imagesArr = [];
    let currentIndex = 0;

    function updateDisplay() {
      document.getElementById('display').innerText = currentInput;
    }

    function appendVal(val) {
      if (currentInput === "0" && val !== '.') {
        currentInput = val;
      } else {
        currentInput += val;
      }
      updateDisplay();
    }

    function clearDisp() {
      currentInput = "0";
      updateDisplay();
    }

    function calculate() {
      if (currentInput === "4321") {
        document.getElementById('vault').style.display = 'block';
        clearDisp();
        return;
      }
      try {
        currentInput = eval(currentInput.replace('×', '*').replace('÷', '/')).toString();
      } catch (e) {
        currentInput = "Error";
      }
      updateDisplay();
    }

    function lockVault() {
      document.getElementById('vault').style.display = 'none';
      clearDisp();
    }

    function loadFiles(event) {
      const files = event.target.files;
      for (let i = 0; i < files.length; i++) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagesArr.push(e.target.result);
          renderGallery();
        }
        reader.readAsDataURL(files[i]);
      }
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = "";
      imagesArr.forEach((src, index) => {
        const img = document.createElement('img');
        img.src = src;
        img.onclick = () => openViewer(index);
        gallery.appendChild(img);
      });
    }

    function openViewer(index) {
      currentIndex = index;
      document.getElementById('fullImg').src = imagesArr[currentIndex];
      document.getElementById('viewer').style.display = 'flex';
    }

    function closeViewer() {
      document.getElementById('viewer').style.display = 'none';
    }

    function nextImg() {
      if (imagesArr.length > 0) {
        currentIndex = (currentIndex + 1) % imagesArr.length;
        document.getElementById('fullImg').src = imagesArr[currentIndex];
      }
    }

    function prevImg() {
      if (imagesArr.length > 0) {
        currentIndex = (currentIndex - 1 + imagesArr.length) % imagesArr.length;
        document.getElementById('fullImg').src = imagesArr[currentIndex];
      }
    }

    function deleteCurrentImg() {
      if (imagesArr.length > 0) {
        imagesArr.splice(currentIndex, 1);
        renderGallery();
        if (imagesArr.length === 0) {
          closeViewer();
        } else {
          currentIndex = currentIndex % imagesArr.length;
          document.getElementById('fullImg').src = imagesArr[currentIndex];
        }
      }
    }
  </script>
</body>
</html>
